name: Model validation
on: workflow_dispatch
env:
  MLFLOW_DISABLE_TELEMETRY: "true"
permissions:
  contents: read
concurrency:
  group: model-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: ml-model-validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/upgrade_milestone9.py --init-ci
      - name: Isolated PostgreSQL and MLflow
        run: docker compose up --build --detach --wait --wait-timeout 300
        env:
          ML_COMPOSE_INFERENCE_ENABLED: 'false'
      - name: Model contract, controlled training, evaluation and promotion gate
        run: python scripts/verify_batch.py
      - name: Publish verified reference and start model serving
        run: |
          python -m ml_platform.ops reference
          docker compose up --detach --no-deps --wait --wait-timeout 300 ml-api
      - name: Schema parity, explanations, delayed labels, drift and HTTP latency benchmark
        run: python scripts/verify_batch2.py --skip-software-checks
      - name: Serving authorization and container controls
        run: python scripts/verify_milestone9.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: model-validation-evidence
          path: |
            reports/model/
            reports/batch-verification.json
            reports/batch-2-verification.json
            reports/api-benchmark.json
            reports/milestone-9-verification.json
          retention-days: 7
      # This workflow has no production credentials or publication permissions.
      # Its "production" registry alias exists only in disposable CI volumes.
      - if: failure()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down --volumes
