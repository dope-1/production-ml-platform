name: Software and security CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
env:
  MLFLOW_DISABLE_TELEMETRY: "true"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: ml_platform
          POSTGRES_DB: ml_platform
          POSTGRES_PASSWORD: ci-disposable-password-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ml_platform -d ml_platform"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      ML_ENVIRONMENT: testing
      ML_DB_PASSWORD: ci-disposable-password-only
      TEST_DATABASE: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest --cov=ml_platform --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=80 --junitxml=reports/tests.xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: software-evidence
          path: |
            reports/coverage.xml
            reports/tests.xml
          retention-days: 7
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ML_ENVIRONMENT: testing
      ML_DB_PASSWORD: ci-disposable-password-only
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Create isolated Python environment
        shell: pwsh
        run: |
          $ciVenv = Join-Path $env:RUNNER_TEMP 'ml-platform-venv'
          python -m venv $ciVenv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $ciVenv 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m pytest tests/unit -q
  security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-security.txt
      - run: python -m pip install -r requirements-security.txt
      - run: python scripts/security_scan.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: source-dependency-security-${{ runner.os }}
          path: reports/security/
          retention-days: 7
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: ml-platform-ci
      ML_COMPOSE_INFERENCE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: mkdir -p reports/security
      # Scan the clean checkout before generating disposable credentials.
      - name: Secret scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: json
          output: reports/security/secrets.json
          exit-code: '1'
      - run: python scripts/upgrade_milestone9.py --init-ci
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: docker compose config --quiet
      - run: docker compose build --pull
      - run: docker compose up --detach --wait --wait-timeout 300
      - run: python scripts/verify_compose.py
      - run: python scripts/verify_milestone9.py --bootstrap --check-rate-limit
      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          image-ref: ml-platform-ci-ml-api:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: reports/security/image.json
          exit-code: '1'
          ignore-unfixed: false
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: container-security-evidence
          path: |
            reports/security/
            reports/milestone-9-verification.json
          retention-days: 7
      - if: failure()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down --volumes
  ci-required:
    if: always()
    needs: [checks, windows, security, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in jobs.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Failed or incomplete CI gates: ' + ', '.join(failed))
          print('All required CI gates passed.')
          PY
