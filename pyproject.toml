[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "production-ml-platform"
version = "0.4.0"
description = "Credit-default ML platform — Milestones 1–9"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "prometheus-client>=0.21,<1", "mlflow>=3.16.1,<3.17", "pyarrow>=23.0.1,<24", "scikit-learn>=1.6,<1.7",
  "lightgbm>=4.6,<5", "pandas>=2.2,<3", "numpy>=1.26,<2.3", "scipy>=1.12,<1.16", "matplotlib>=3.9,<4",
  "shap>=0.47,<0.50", "xlrd>=2,<3", "filelock>=3.16,<4", "pyyaml>=6,<7"
]
[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1.14,<3", "pandas-stubs>=2.2,<3", "types-PyYAML>=6,<7"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["integration: requires a real PostgreSQL database"]
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".fix-venv", ".security-venv", ".state", "mlruns", "data/processed", "reports"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "mlflow.*", "lightgbm.*", "shap.*"]
ignore_missing_imports = true
