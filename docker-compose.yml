services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${ML_DB_USER:-ml_platform}
      POSTGRES_DB: ${ML_DB_NAME:-ml_platform}
      POSTGRES_PASSWORD: ${ML_DB_PASSWORD:?Set ML_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  migrate:
    build: .
    env_file: .env
    environment:
      ML_DB_HOST: postgres
      ML_DB_PORT: 5432
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  ml-api:
    build: .
    env_file: .env
    environment:
      ML_DB_HOST: postgres
      ML_DB_PORT: 5432
      ML_AUTH_ENABLED: ${ML_AUTH_ENABLED:-true}
      ML_ALLOWED_HOSTS: '["localhost", "127.0.0.1"]'
      ML_INFERENCE_ENABLED: ${ML_COMPOSE_INFERENCE_ENABLED:-true}
      ML_TRACKING_URI: http://mlflow:5000
      ML_CONTROL_DIR: /registry-control
      MLFLOW_HTTP_REQUEST_TIMEOUT: 10
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: 1
      MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR: "false"
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - ./.state/registry:/registry-control:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
  mlflow:
    build: .
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost:5000,127.0.0.1:5000"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "http://localhost:5000,http://127.0.0.1:5000"
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--workers", "1", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--serve-artifacts", "--artifacts-destination", "/mlflow/artifacts"]
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  mlflow_data:
  postgres_data:
